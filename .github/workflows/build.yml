name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: InkCanvasForClass/community/.github/workflows/plugin-build.yml@net6
    with:
      project: RemoteMessagePlugin.csproj
      plugin_id: org.inkcanvas.remotemessage
      plugin_name: RemoteMessage
      plugin_description: '远程消息，支持 WebUI、POST API、令牌鉴权与限流'
      create_release: false
      auto_release: true
    secrets: inherit
